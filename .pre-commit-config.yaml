# Local guard rails. Install once with:
#   pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
        exclude: ^apps/web/tsconfig.*\.json$
      - id: check-merge-conflict
      - id: detect-private-key
      - id: forbid-submodules

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --check
        language: system
        files: \.(ts|tsx|js|mjs|json|css|md|ya?ml)$
        exclude: ^(node_modules|dist|package-lock\.json|packages/api-client/generated)/
      - id: eslint
        name: eslint
        entry: npm run lint --workspace @tripat/web --
        language: system
        files: ^apps/web/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: bash -c 'cd apps/api && .venv/bin/mypy app'
        language: system
        files: ^apps/api/app/.*\.py$
        pass_filenames: false
