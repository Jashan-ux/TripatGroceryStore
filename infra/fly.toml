# Fly.io alternative to Render. Deploy from apps/api:
#   fly launch --no-deploy --copy-config --name tripat-msgstore-api
#   fly secrets set DATABASE_URL=... SUPABASE_URL=... (see docs/DEPLOY.md)
app = "tripat-msgstore-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  PORT = "8000"
  SUPABASE_STORAGE_BUCKET = "catalog"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz/ready"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
