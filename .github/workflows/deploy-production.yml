name: Deploy · production

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a production release'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "::error::Confirmation missing"; exit 1
          fi

  migrate:
    runs-on: ubuntu-latest
    needs: [guard]
    environment: production
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Alembic upgrade (production database)
        working-directory: apps/api
        env:
          DATABASE_DIRECT_URL: ${{ secrets.PRODUCTION_DATABASE_DIRECT_URL }}
        run: |
          pip install -e .
          alembic upgrade head

  api:
    name: Deploy API (production)
    runs-on: ubuntu-latest
    needs: [migrate]
    environment: production
    steps:
      - name: Trigger host deploy
        env:
          HOOK: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::error::RENDER_PRODUCTION_DEPLOY_HOOK is not set"; exit 1; fi
          curl --fail --silent --show-error -X POST "$HOOK"

  web:
    name: Deploy web (production)
    runs-on: ubuntu-latest
    needs: [api]
    environment: production
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Render host config
        working-directory: apps/web
        env:
          API_ORIGIN: ${{ vars.PRODUCTION_API_ORIGIN }}
        run: node scripts/render-host-config.mjs
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@48
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --token="$VERCEL_TOKEN"
      - name: Smoke test
        env:
          WEB_BASE: ${{ vars.PRODUCTION_WEB_URL }}
          API_BASE: ${{ vars.PRODUCTION_API_ORIGIN }}
        run: |
          set -euo pipefail
          curl --fail --silent "$API_BASE/healthz/ready" | head -c 200; echo
          curl --fail --silent "$WEB_BASE/" | grep -q "Tripat Pansari"
          if curl --silent -o /dev/null -w "%{http_code}" "$API_BASE/docs" | grep -q 200; then
            echo "::error::/docs is reachable in production"; exit 1
          fi
          echo "Smoke test passed"
