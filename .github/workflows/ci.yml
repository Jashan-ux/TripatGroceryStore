name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  api:
    name: API · lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tripat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: apps/api
        run: ruff check . && ruff format --check .
      - name: Mypy (strict)
        working-directory: apps/api
        run: |
          # mypy exits 2 on errors; re-raise each one as an annotation so the
          # failure is readable in the run summary without downloading logs.
          if mypy app --no-color-output > /tmp/mypy.txt 2>&1; then
            cat /tmp/mypy.txt
          else
            cat /tmp/mypy.txt
            grep -E "error:" /tmp/mypy.txt | head -25 | sed 's/^/::error title=mypy::/'
            exit 1
          fi
      - name: Alembic migrations (up, down, up)
        working-directory: apps/api
        env:
          DATABASE_DIRECT_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tripat_test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tripat_test
        run: |
          # Surface the actual database error: log archives are not always
          # downloadable, annotations always are.
          step() {
            if "$@" > /tmp/alembic.txt 2>&1; then
              echo "ok: $*"
            else
              grep -iE "error|exception|fatal" /tmp/alembic.txt | tail -12 | while IFS= read -r line; do
                echo "::error title=alembic $*::$line"
              done
              return 1
            fi
          }
          step alembic upgrade head
          step alembic downgrade base
          step alembic upgrade head
      - name: Pytest
        working-directory: apps/api
        env:
          ENVIRONMENT: test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tripat_test
          TEST_REDIS_URL: redis://localhost:6379/0
        run: |
          if pytest --cov=app --cov-report=xml --cov-report=term-missing > /tmp/pytest.txt 2>&1; then
            tail -20 /tmp/pytest.txt
          else
            tail -80 /tmp/pytest.txt
            grep -E "^(FAILED|ERROR)" /tmp/pytest.txt | head -25 | sed 's/^/::error title=pytest::/'
            exit 1
          fi
      - name: OpenAPI schema is in sync
        working-directory: apps/api
        run: |
          python -m app.scripts.dump_openapi /tmp/openapi.json
          diff <(python -c "import json;print(json.dumps(json.load(open('/tmp/openapi.json')),sort_keys=True,indent=2))") \
               <(python -c "import json;print(json.dumps(json.load(open('../../packages/api-client/openapi.json')),sort_keys=True,indent=2))") \
            || (echo "::error::OpenAPI schema changed — run 'npm run api:types' and commit" && exit 1)
      - uses: actions/upload-artifact@v4.5.0
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          if-no-files-found: ignore

  web:
    name: Web · lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        working-directory: apps/web
        run: npm run test:coverage
      - name: Build + bundle budget (P‑01)
        working-directory: apps/web
        run: |
          npm run build:only
          node scripts/check-bundle-size.mjs
      - uses: actions/upload-artifact@v4.5.0
        if: always()
        with:
          name: web-build
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: E2E · Playwright (360×800, 1280×800)
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: npm ci
      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: apps/web
        env:
          CI: 'true'
        run: npx playwright test
      - uses: actions/upload-artifact@v4.5.0
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
      - uses: actions/upload-artifact@v4.5.0
        if: always()
        with:
          name: playwright-test-results
          path: apps/web/test-results
          retention-days: 14

  security:
    name: Security · secrets, audits, headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      # The marketplace action calls a licensing endpoint that intermittently
      # returns 5xx; the official binary needs no network beyond the download and
      # produces the same result deterministically.
      - name: gitleaks (secret scan)
        env:
          GITLEAKS_VERSION: '8.21.2'
        run: |
          if ! curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks; then
            echo "::error title=gitleaks::could not download the scanner"
            exit 1
          fi
          gitleaks version
          set +e
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner \
            --report-format json --report-path gitleaks-report.json --exit-code 1 \
            --log-opts="--all" > gitleaks-log.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python3 apps/web/scripts/report_gitleaks.py
          fi
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-audit (no high/critical vulnerabilities)
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          pip-audit --skip-editable --progress-spinner off
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
      - name: No secrets in the built bundle
        run: |
          npm run build --workspace @tripat/web
          if grep -rInE "SERVICE_ROLE|service_role|SUPABASE_SERVICE|-----BEGIN [A-Z ]*PRIVATE KEY" apps/web/dist; then
            echo "::error::A secret-looking string reached the client bundle"; exit 1
          fi

  docker:
    name: API · container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.7.1
      - name: Build image
        uses: docker/build-push-action@v6.9.0
        with:
          context: apps/api
          push: false
          tags: tripat-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
