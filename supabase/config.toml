# Supabase CLI configuration for local development.
#
# IMPORTANT: the database schema is owned by **Alembic** (apps/api/migrations),
# never by `supabase db push` and never by the dashboard SQL editor. We therefore
# do not use supabase/migrations. `supabase start` gives us local Auth, Storage
# and the Postgres instance; Alembic then creates the tables.
#
#   supabase start
#   supabase status            # copy the API URL, anon key, service_role key
#   (cd apps/api && alembic upgrade head)
#
# project_id must match the folder name for the CLI.
project_id = "tripat-msgstore"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "2MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "http://127.0.0.1:5173/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[auth.external.google]
enabled = false
# Owner supplies real credentials (see docs/DEPLOY.md step 6).
client_id = ""
secret = ""
skip_nonce_check = false

[analytics]
enabled = false
