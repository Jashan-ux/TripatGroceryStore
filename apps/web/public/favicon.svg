<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="Tripat Pansari MSG Store">
  <title>Tripat Pansari · MSG Store</title>
  <!--
    PLACEHOLDER brand artwork. The owner supplies the final 110x110 logo; drop it
    in as public/brand/logo.png and update BrandMark, then run `npm run icons`.
    This monogram ships so no view ever renders a broken image.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>
  <circle cx="110" cy="110" r="110" fill="url(#g)"/>
  <circle cx="110" cy="110" r="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
  <text x="110" y="104" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="58" font-weight="700" fill="#FFFFFF" letter-spacing="1">MSG</text>
  <text x="110" y="140" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="17" font-weight="600" fill="#FFFFFF" letter-spacing="3.4">TRIPAT</text>
  <text x="110" y="162" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="12" font-weight="500" fill="#FEE2E2" letter-spacing="2.6">PANSARI</text>
</svg>
