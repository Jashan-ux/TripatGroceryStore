[project]
name = "tripat-api"
version = "0.1.0"
description = "Tripat Pansari · MSG Store — FastAPI backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.15.1",
    "structlog==24.4.0",
    "python-multipart==0.0.34",
    # Product images are re-encoded server-side before they are stored: that is
    # what makes a polyglot upload harmless, so it is a runtime dependency, not
    # an optional integration.
    "pillow==13.0.0",
    # Web Push is a Phase 7 runtime feature; deliver to opted-in browsers after
    # the offer transaction commits. Email remains an optional integration.
    "pywebpush==2.0.3",
    "py-vapid==1.9.6",
]

[project.optional-dependencies]
# Email / push / image pipeline land with their phases (Phase 3+). Pinned here so the
# lockfile and audit results stay reproducible from day one.
integrations = [
    "resend==2.5.1",
]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
]

[project.scripts]
tripat-api = "app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",   # asserts are for tests, also used for internal invariants
    "B008",   # FastAPI dependency-injection idiom: Depends() in defaults
    "RUF001", # en-dash/middot in user-facing copy is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"migrations/*" = ["E501"]
# The seeder builds INSERT statements from its own frozen constants; every value
# goes through _quote() (single-quote doubling) and numbers are ints. There is no
# user input on this path, and the generated SQL is committed for review.
"app/scripts/seed.py" = ["S608", "E501"]
# Analytics builds SQL from its own module constants (table aliases, the
# Asia/Kolkata date predicates, the revenue-status list). Every *value* — dates,
# page, tier, search text, status — is a bound parameter; there is no user input
# in the f-string on that path.
"app/repositories/analytics.py" = ["S608"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["resend.*", "pywebpush.*", "py_vapid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
# So a test module may import another (tests.test_orders holds the shared order
# helpers) no matter how pytest is invoked — `pytest` alone does not put the
# working directory on sys.path the way `python -m pytest` does.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: requires a real Postgres (TEST_DATABASE_URL); skipped when unset",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/cli.py"]
